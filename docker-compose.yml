version: '3.8'

services:
  # Service Aplikasi (PHP-FPM) dari Image Anda
  app:
    image: matterisnanto/cindypetshop-web:latest
    container_name: cindypetshop-app
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env
      - ./storage:/var/www/storage
    networks:
      - cindypetshop-net

  # Service Database (Diganti ke MariaDB)
  db:
    image: mariadb:10.6 # <-- PERUBAHAN DI SINI. Menggunakan MariaDB versi 10.6
    container_name: cindypetshop-db
    restart: unless-stopped
    environment:
      # Variabel ini berfungsi sama untuk MariaDB
      MYSQL_DATABASE: ${DB_DATABASE:-cindypetshop_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-db_user}
    volumes:
      - cindypetshop-db-data:/var/lib/mysql
    networks:
      - cindypetshop-net

  # Service Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: cindypetshop-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Mount source code untuk file statis
      - ./src:/var/www
    networks:
      - cindypetshop-net
    depends_on:
      - app

networks:
  cindypetshop-net:
    driver: bridge

volumes:
  cindypetshop-db-data:
    driver: local