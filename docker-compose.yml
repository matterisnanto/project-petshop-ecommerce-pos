version: '3.8'

services:
  # Service Aplikasi (PHP-FPM)
  app:
    build:
      context: https://github.com/matterisnanto/project-petshop-ecommerce-pos.git
      dockerfile: Dockerfile
    container_name: filament-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - ./.env:/var/www/.env
    networks:
      - filament

  # Service Database (MySQL)
  db:
    image: mysql:8.0
    container_name: filament-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - filament-db-data:/var/lib/mysql
    networks:
      - filament
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

  # Service Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: filament-nginx
    restart: unless-stopped
    ports:
      - "8088:80" # Ubah 8000 jika port tersebut sudah digunakan
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - filament

networks:
  filament:
    driver: bridge

volumes:
  filament-db-data:
    driver: local